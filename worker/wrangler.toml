name = "chess-trainer-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Usernames (comma separated) that get the admin page: password resets and account removal.
ADMINS = "MuellerCodes"
# Sites allowed to call the API from a browser.
ALLOWED_ORIGINS = "https://muellercodes.github.io,http://localhost:8000,http://127.0.0.1:8000"

[[d1_databases]]
binding = "DB"
database_name = "chess-trainer-db"
database_id = "f46582df-5511-45ed-a374-71a1eb958d11"
migrations_dir = "migrations"
